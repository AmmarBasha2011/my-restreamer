<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INEX Team | Advanced Restreamer</title>
  <style>
    :root {
      --bg-color: #0B0F14;
      --card-bg: #121826;
      --primary: #3B82F6;
      --secondary: #7C3AED;
      --success: #22C55E;
      --danger: #EF4444;
      --text-main: #E5E7EB;
      --text-muted: #9CA3AF;
      --border: #1F2937;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    .header {
      background-color: var(--card-bg);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .card-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card-body {
      padding: 1.25rem;
      flex-grow: 1;
    }

    .card-footer {
      padding: 1.25rem;
      background-color: rgba(255, 255, 255, 0.02);
      border-top: 1px solid var(--border);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(156, 163, 175, 0.1);
      color: var(--text-muted);
    }

    .status-badge.live {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .status-badge.live .status-dot {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    button:hover {
      filter: brightness(110%);
      transform: translateY(-1px);
    }

    button:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      opacity: 0.5;
    }

    button.danger {
      background: var(--danger);
    }

    button.secondary {
      background: var(--secondary);
    }

    input {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .playlist-box {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 0.75rem;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 0.5rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .playlist-item {
      font-size: 0.85rem;
      padding: 0.4rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
    }

    .playlist-item:last-child {
      border-bottom: none;
    }

    .logs-container {
      margin-top: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .logs-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logs-body {
      padding: 1rem;
      height: 300px;
      overflow-y: auto;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.8rem;
      background: #05070a;
    }

    .log-entry {
      margin-bottom: 0.25rem;
      line-height: 1.4;
    }

    .log-time { color: var(--text-muted); margin-right: 0.5rem; }
    .log-type-info { color: var(--primary); }
    .log-type-success { color: var(--success); }
    .log-type-error { color: var(--danger); }
    .log-type-sync { color: var(--secondary); }

    @media (max-width: 768px) {
      .header {
        padding: 1rem;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .logs-body {
        height: 200px;
      }
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--secondary);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      bottom: 3rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>INEX Team Restreamer</h1>
    <button id="add-dest-btn">+ New Channel</button>
  </header>

  <main class="container">
    <div id="destinations-grid" class="grid"></div>

    <section class="logs-container">
      <div class="logs-header">
        <h2 style="margin:0; font-size:1rem;">System Activity Logs</h2>
        <button onclick="clearLogs()" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" class="secondary">Clear</button>
      </div>
      <div id="logs-body" class="logs-body"></div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    const grid = document.getElementById('destinations-grid');
    const logsBody = document.getElementById('logs-body');
    const toast = document.getElementById('toast');
    const addDestBtn = document.getElementById('add-dest-btn');

    const api = {
      get: (endpoint) => fetch(endpoint).then(res => res.ok ? res.json() : Promise.reject(res)),
      post: (endpoint, body) => fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
      delete: (endpoint) => fetch(endpoint, { method: 'DELETE' })
    };

    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.style.background = isError ? 'var(--danger)' : 'var(--secondary)';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function addLog(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const now = new Date().toLocaleTimeString();
      entry.innerHTML = `<span class="log-time">[${now}]</span> <span class="log-type-${type}">${type.toUpperCase()}</span> ${message}`;
      logsBody.appendChild(entry);
      logsBody.scrollTop = logsBody.scrollHeight;
    }

    function clearLogs() {
      logsBody.innerHTML = '';
    }

    // SSE Setup for Logs
    const eventSource = new EventSource('/api/logs');
    eventSource.onmessage = (event) => {
      const log = JSON.parse(event.data);
      addLog(log.message, log.type);
    };

    function updateCardContent(card, dest) {
      if (!card.innerHTML) {
        card.innerHTML = `
          <div class="card-header">
            <h2 class="dest-name"></h2>
            <div class="status-badge">
              <div class="status-dot"></div>
              <span class="status-text">Offline</span>
            </div>
          </div>
          <div class="card-body">
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">Repository Sync</div>
            <form class="repo-form" data-id="${dest.id}">
              <input type="text" name="repoUrl" placeholder="https://github.com/owner/repo" required>
              <button type="submit" style="width:100%">Sync Repository</button>
            </form>
            <div style="margin-top: 1.5rem;">
              <div style="font-size: 0.8rem; color: var(--text-muted);">Playlist Content</div>
              <div class="playlist-box">
                <ul class="playlist-ul"></ul>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <div style="display: flex; gap: 0.5rem; justify-content: space-between;">
              <div style="display: flex; gap: 0.5rem;">
                <button class="start-btn success">▶ Start</button>
                <button class="stop-btn danger">⏹ Stop</button>
              </div>
              <button class="delete-btn danger" style="opacity: 0.6;">Delete</button>
            </div>
          </div>
        `;

        card.querySelector('.delete-btn').onclick = () => deleteDestination(dest.id);
        card.querySelector('.start-btn').onclick = () => startStream(dest.id);
        card.querySelector('.stop-btn').onclick = () => stopStream(dest.id);

        const form = card.querySelector('.repo-form');
        form.onsubmit = async (e) => {
          e.preventDefault();
          const repoUrl = form.repoUrl.value;
          const btn = form.querySelector('button');
          btn.disabled = true;
          btn.textContent = 'Syncing...';
          try {
            const res = await api.post(`/api/destinations/${dest.id}/repo`, { repoUrl });
            showToast(await res.text());
          } catch (e) {
            showToast('Sync failed', true);
          } finally {
            btn.disabled = false;
            btn.textContent = 'Sync Repository';
          }
        };
      }

      card.querySelector('.dest-name').textContent = dest.name;
      const badge = card.querySelector('.status-badge');
      const statusText = card.querySelector('.status-text');

      if (dest.isStreaming) {
        badge.classList.add('live');
        statusText.textContent = 'Live';
      } else {
        badge.classList.remove('live');
        statusText.textContent = 'Offline';
      }

      card.querySelector('.start-btn').disabled = dest.isStreaming;
      card.querySelector('.stop-btn').disabled = !dest.isStreaming;

      const repoInput = card.querySelector('input[name="repoUrl"]');
      if (document.activeElement !== repoInput && dest.repoUrl) {
        repoInput.value = dest.repoUrl;
      }

      const playlistUl = card.querySelector('.playlist-ul');
      const newPlaylistHtml = dest.playlist.length > 0 ? dest.playlist.map(f => `<li class="playlist-item">${f}</li>`).join('') : '<li class="playlist-item">No videos found</li>';
      if (playlistUl.innerHTML !== newPlaylistHtml) {
        playlistUl.innerHTML = newPlaylistHtml;
      }
    }

    async function refreshDestinations() {
      try {
        const destinations = await api.get('/api/destinations');
        const destIds = new Set(destinations.map(d => d.id));

        Array.from(grid.children).forEach(card => {
          if (!destIds.has(card.id.replace('dest-', ''))) grid.removeChild(card);
        });

        destinations.forEach(dest => {
          let card = document.getElementById(`dest-${dest.id}`);
          if (!card) {
            card = document.createElement('div');
            card.className = 'card';
            card.id = `dest-${dest.id}`;
            grid.appendChild(card);
          }
          updateCardContent(card, dest);
        });
      } catch (err) {
        console.error(err);
      }
    }

    addDestBtn.onclick = async () => {
      const name = prompt('Channel Name:');
      if (!name) return;
      const key = prompt('Stream Key:');
      if (!key) return;

      try {
        await api.post('/api/destinations', { name, key });
        showToast('Channel added');
        refreshDestinations();
      } catch (e) {
        showToast('Failed to add channel', true);
      }
    };

    window.deleteDestination = async (id) => {
      if (confirm('Delete this channel?')) {
        await api.delete(`/api/destinations/${id}`);
        refreshDestinations();
      }
    };

    window.startStream = async (id) => {
      const res = await api.post(`/api/stream/start/${id}`, {});
      showToast(await res.text());
      refreshDestinations();
    };

    window.stopStream = async (id) => {
      const res = await api.post(`/api/stream/stop/${id}`, {});
      showToast(await res.text());
      refreshDestinations();
    };

    refreshDestinations();
    setInterval(refreshDestinations, 5000);
  </script>
</body>
</html>
